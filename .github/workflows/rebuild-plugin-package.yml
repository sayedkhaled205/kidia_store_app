name: Rebuild installable plugin package

on:
  push:
    branches:
      - 'work/**'
      - 'agent/**'
    paths:
      - 'kidia-mobile-cms/**'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build WordPress plugin archive
        run: |
          zip -qr /tmp/kidia-mobile-cms.zip kidia-mobile-cms
          mv /tmp/kidia-mobile-cms.zip kidia-mobile-cms.zip
      - name: Commit current plugin archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kidia-mobile-cms.zip
          git diff --cached --quiet || git commit -m "Build current plugin package"
          git push origin HEAD:${{ github.ref_name }}
