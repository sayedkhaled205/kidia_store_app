name: Quality checks

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  odoo-connector:
    name: Shared Odoo address and shipping contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.1.1
      - name: Check shared connector contracts
        run: |
          python connectors/odoo/source/woomobile_native_customer_api51/tests/test_cart_contract85_host.py
          python connectors/odoo/source/woomobile_native_customer_api51/tests/test_shipping100_host.py
          python connectors/odoo/source/woomobile_native_customer_api51/tests/test_checkout101_host.py

  commerce-contracts:
    name: Commerce contracts (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [woocommerce, shopify, odoo]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check matrix runner
        run: |
          python3 -m unittest discover -s tool -p test_verify_commerce_matrix.py
          python3 -m unittest discover -s tool -p test_native_build_defines81.py
      - name: Test two merchants with explicit platform builds
        run: python3 tool/verify_commerce_matrix.py --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commerce-contracts-${{ matrix.platform }}
          path: |
            build/commerce-matrix.json
            build/${{ matrix.platform }}-*.log
          if-no-files-found: error

  plugin:
    name: WordPress plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find mobishop -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: find mobishop -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install Builder browser test dependencies
        run: npm ci
      - name: Validate signed dual-platform build workflow
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 tool/test_unified_workflow.py
      - name: Run Builder browser contract tests
        run: npm run test:builders
      - name: Verify shared live publication controls
        run: |
          python3 tool/generate_app_ui_controls.py --check
          node tools/live_ui_controls/page-controls.test.cjs
          node tools/live_ui_controls/page-controls-runtime.test.cjs
          php tools/live_ui_controls/presentation-test.php
          php tools/live_ui_controls/normalization-test.php
      - name: Check connected sign-in preview availability
        run: node tool/builder-assets/preview-auth-config.test.cjs
      - name: Check shared preview scrolling and element selection
        run: |
          node tool/builder-assets/preview-interactions.test.cjs
          node tool/builder-assets/category-designer.test.cjs
          node tool/builder-assets/push-analytics.test.cjs
          php tool/builder-assets/push-analytics-contract.php
      - name: Run PHP contract tests
        run: find mobishop/tests -type f -name '*-test.php' -print0 | sort -z | xargs -0 -n1 php

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify desktop preview gestures and idle selection
        run: flutter test --dart-define=CMS_PREVIEW=true test/features/home/presentation/widgets/preview_interaction_test.dart test/app/app_locale_test.dart
      - name: Build embedded CMS Flutter Web preview
        run: bash tool/build_cms_flutter_preview.sh
      - name: Upload CMS Flutter Web preview
        uses: actions/upload-artifact@v4
        with:
          name: cms-flutter-preview
          path: mobishop/admin/flutter-preview
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify committed preview matches current Flutter source
        run: |
          # Preserve content checks without treating build IDs, license order,
          # or one shell-inserted blank line as runtime regressions.
          python3 -m unittest discover -s tool -p test_verify_cms_preview_artifacts.py
          python3 tool/verify_cms_preview_artifacts.py
          node --check mobishop/admin/flutter-preview/main.dart.js
      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=STORE_URL=https://example.com
          --dart-define=STORE_NAME=MobiShop
          --dart-define=STORE_LOCALE=ar
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
