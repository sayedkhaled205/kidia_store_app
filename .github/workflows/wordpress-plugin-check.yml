name: WordPress.org package check

on:
  pull_request:
    paths:
      - 'mobishop/**'
      - 'tool/build_wordpress_org_package.sh'
      - 'tool/bump_wordpress_plugin_version.sh'
      - '.github/workflows/wordpress-plugin-check.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'mobishop/**'
      - 'tool/build_wordpress_org_package.sh'
      - 'tool/bump_wordpress_plugin_version.sh'
      - '.github/workflows/wordpress-plugin-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build, install, and validate directory package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package image tools
        run: >-
          command -v ffmpeg >/dev/null 2>&1 && command -v identify >/dev/null 2>&1
          || { sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick; }
      - name: Build WordPress.org package
        run: bash tool/build_wordpress_org_package.sh
      - name: Validate installable ZIP layout
        run: |
          test -f build/wordpress-org/mobishop/mobishop.php
          test ! -d build/wordpress-org/mobishop/mobishop
          unzip -Z1 build/wordpress-org/mobishop.zip | grep -qx 'mobishop/mobishop.php'
          unzip -Z1 build/wordpress-org/mobishop.zip | grep -qx 'mobishop/readme.txt'
          ! unzip -Z1 build/wordpress-org/mobishop.zip | grep -q '^mobishop/mobishop/'
          ! unzip -Z1 build/wordpress-org/mobishop.zip | grep -Ev '^mobishop(/|$)' | grep -q .
          grep -q '^ \* Version:           1.46.65$' build/wordpress-org/mobishop/mobishop.php
          grep -q '^ \* Text Domain:       mobishop$' build/wordpress-org/mobishop/mobishop.php
      - name: Run PHP contract tests
        run: find mobishop/tests -type f -name '*-test.php' -print0 | sort -z | xargs -0 -n1 php
      - name: Run official Plugin Check and activation
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/wordpress-org/mobishop'
          categories: plugin_repo
      - name: Upload tested installable package
        uses: actions/upload-artifact@v4
        with:
          name: mobishop-wordpress-org
          path: build/wordpress-org/mobishop.zip
          if-no-files-found: error
