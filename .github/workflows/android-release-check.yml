name: Android release check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-release-check.yml'
      - 'android/**'
      - 'codemagic.yaml'
      - 'tool/android_build_version.sh'
      - 'tool/test_android_build_version.sh'
      - 'tool/build_app_icons.py'
      - 'tool/test_build_app_icons.py'
      - 'tool/requirements-build.txt'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check version request boundaries
        run: bash tool/test_android_build_version.sh
      - name: Test and generate native icon fixture
        run: |
          python3 -m pip install -r tool/requirements-build.txt
          python3 tool/test_build_app_icons.py
          python3 -c "from PIL import Image; Image.new('RGB', (512, 256), (13, 71, 149)).save('/tmp/icon-fixture.png')"
          python3 tool/build_app_icons.py --input /tmp/icon-fixture.png
      - name: Create disposable signing fixture
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci-test.jks" \
            -alias ci-test -storepass ci-test-password -keypass ci-test-password \
            -dname 'CN=MobiShop CI Test' -keyalg RSA -keysize 2048 -validity 2
      - name: Compile signed release fixture
        env:
          CM_KEYSTORE_PATH: ${{ runner.temp }}/ci-test.jks
          CM_KEYSTORE_PASSWORD: ci-test-password
          CM_KEY_ALIAS: ci-test
          CM_KEY_PASSWORD: ci-test-password
          MOBISHOP_REQUIRE_RELEASE_SIGNING: 'true'
          ORG_GRADLE_PROJECT_APP_NAME: 'كيديا اختبار'
          ORG_GRADLE_PROJECT_APPLICATION_ID: com.mobishop.releasecheck
          BUILD_VERSION_NAME: '1.2.3'
          BUILD_VERSION_CODE: '123'
        run: |
          source tool/android_build_version.sh
          flutter build apk --release "${MOBISHOP_BUILD_VERSION_ARGS[@]}" \
            --dart-define=STORE_URL=https://example.com \
            --dart-define=STORE_NAME=MobiShop \
            --dart-define=STORE_LOCALE=ar
      - name: Check actual APK identity and certificate
        run: |
          set -euo pipefail
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -F 'CN=MobiShop CI Test' "$RUNNER_TEMP/signature.txt"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.mobishop.releasecheck' versionCode='123' versionName='1.2.3'" "$RUNNER_TEMP/badging.txt"
          grep -F "application-label:'كيديا اختبار'" "$RUNNER_TEMP/badging.txt"
          python3 - <<'PY'
          import io, os, zipfile
          from pathlib import Path
          from PIL import Image
          lines = (Path(os.environ['RUNNER_TEMP']) / 'badging.txt').read_text().splitlines()
          icon_path = next(line.split("'")[1] for line in lines if line.startswith('application-icon-640:'))
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as apk:
              with Image.open(io.BytesIO(apk.read(icon_path))) as icon:
                  assert icon.size == (192, 192)
                  assert icon.convert('RGB').getpixel((96, 96)) == (13, 71, 149)
                  assert icon.convert('RGB').getpixel((0, 0)) == (255, 255, 255)
          print('APK contains the generated customer icon.')
          PY
      - name: Check required signing fails without a key
        run: |
          set -euo pipefail
          cd android
          if MOBISHOP_REQUIRE_RELEASE_SIGNING=true ./gradlew :app:tasks > "$RUNNER_TEMP/missing-key.log" 2>&1; then
            echo 'Build unexpectedly accepted missing release credentials.'
            exit 1
          fi
          grep -F 'A release keystore is required' "$RUNNER_TEMP/missing-key.log"
