name: Rebuild embedded CMS preview

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'work/**'
    paths:
      - '.github/workflows/rebuild-cms-preview.yml'
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/build_cms_flutter_preview.sh'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/build_cms_flutter_preview.sh
      - name: Commit current Flutter preview and plugin package
        run: |
          zip -qr /tmp/kidia-mobile-cms.zip kidia-mobile-cms
          mv /tmp/kidia-mobile-cms.zip kidia-mobile-cms.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kidia-mobile-cms/admin/flutter-preview kidia-mobile-cms.zip
          git diff --cached --quiet || git commit -m "Build current Flutter preview and plugin package"
          git push origin HEAD:${{ github.ref_name }}
