workflows:
  mobishop-ios-simulator-check:
    name: Customer iOS simulator verification
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
      vars:
        STORE_URL: "https://kidiastore.com"
        STORE_PLATFORM: "woocommerce"
        STORE_NAME: "\u0643\u064a\u062f\u064a\u0627 \u0633\u062a\u0648\u0631"
        STORE_LOCALE: "ar"
        STORE_COUNTRY_CODE: "EG"
        IOS_BUNDLE_ID: "app.mobishop.d983d98ad8afd98ad8a7d8b3d8aad988d8b1"
        APPLE_SIGN_IN_REQUIRED: "true"
        APP_DESIGN_UPDATE_URL: "https://api.woomobile.app/v1/app-design/6990b322-e396-46bb-a188-a1e472b6bf64"
    scripts:
      - name: Verify release315 source and public design snapshot
        script: |
          set -euo pipefail
          git diff --exit-code 6d7eb6b1ad35e4670491e947cb46214e473bc809 -- lib android ios test integration_test test_driver assets packages pubspec.yaml pubspec.lock tool
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          data=Path('.qa/release315-public-design.b64').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '388b2243f1bf64ff0961fad7d6c3938ec7579c4bca27c7faa0f141b5b23c2b9e'
          with open(os.environ['CM_ENV'], 'a', encoding='utf-8') as target:
              target.write('APP_DESIGN_BUNDLE='+data.decode('ascii')+'\n')
          print('Release315 application source and embedded public design verified.')
          PY
      - name: Freeze public iOS sign-in configuration
        script: |
          set -euo pipefail
          python3 tool/test_prepare_native_auth_build.py
          python3 tool/prepare_native_auth_build.py --output "${CM_BUILD_DIR:?}/.mobishop-native-auth.json" --env-file "${CM_ENV:?}"
      - name: Validate public customer configuration
        script: |
          set -euo pipefail
          test -n "${STORE_URL:?}"
          test -n "${IOS_BUNDLE_ID:?}"
          test -n "${STORE_NAME:?}"
          python3 tool/test_configure_ios_store.py
          python3 tool/configure_ios_store.py --simulator
          python3 tool/native_build_defines81.py --output "${CM_BUILD_DIR:?}/.mobishop-native-defines.json"
      - name: Prepare Flutter and selected app icon
        script: |
          set -euo pipefail
          flutter pub get
          python3 -m venv "$CM_BUILD_DIR/.icon-tools"
          "$CM_BUILD_DIR/.icon-tools/bin/pip" install -r tool/requirements-build.txt
          "$CM_BUILD_DIR/.icon-tools/bin/python" tool/build_app_icons.py
      - name: Verify application source
        script: |
          set -euo pipefail
          flutter analyze lib test
          flutter test
      - name: Verify merchant and platform contracts
        script: |
          set -euo pipefail
          python3 -m unittest discover -s tool -p test_native_build_defines81.py
          python3 tool/verify_commerce_matrix.py --platform "${STORE_PLATFORM:-woocommerce}"
      - name: Validate actual compiled customer design
        script: |
          set -euo pipefail
          python3 tool/native_build_defines81.py --output "${CM_BUILD_DIR:?}/.mobishop-native-defines.json"
          flutter test test/core/app_design/compiled_design_preflight297_test.dart \
            --dart-define=REQUIRE_SAVED_DESIGN=true \
            --dart-define-from-file="${CM_BUILD_DIR:?}/.mobishop-native-defines.json" \
            --dart-define="STORE_URL=$STORE_URL" \
            --dart-define="STORE_NAME=${STORE_NAME:-MobiShop Store}" \
            --dart-define="STORE_LOCALE=${STORE_LOCALE:-en}" \
            --dart-define="PUSH_CONFIG_URL=${PUSH_CONFIG_URL:-}"
      - name: Compile iOS simulator application
        script: |
          set -euo pipefail
          flutter build ios --simulator --debug \
            --dart-define-from-file="${CM_BUILD_DIR:?}/.mobishop-native-defines.json" \
            --dart-define="STORE_URL=$STORE_URL" \
            --dart-define="STORE_NAME=$STORE_NAME" \
            --dart-define="STORE_LOCALE=${STORE_LOCALE:-en}" \
            --dart-define="PUSH_CONFIG_URL=${PUSH_CONFIG_URL:-}"
      - name: Launch on iPhone simulator
        script: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$CM_BUILD_DIR/.simulator-devices.json"
          SIMULATOR_ID=$(python3 -c 'import json,os; data=json.load(open(os.environ["CM_BUILD_DIR"]+"/.simulator-devices.json")); print(next(d["udid"] for runtime,devices in data["devices"].items() if ".iOS-" in runtime for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/ios/iphonesimulator/Runner.app
          mkdir -p build/ios/simulator-artifacts
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app build/ios/simulator-artifacts/Runner-simulator.zip
          python3 tool/test_verify_ios_simulator.py
          if ! python3 tool/verify_ios_simulator.py --device "$SIMULATOR_ID" --report build/ios/simulator-artifacts/launch-check.json; then
            echo 'Startup inspection failed; retain diagnostics and run the independent UI fixtures before the final gate.'
          fi
          printf 'IOS_TEST_DEVICE=%s\n' "$SIMULATOR_ID" >> "$CM_ENV"
      - name: Exercise customer flows on the iOS engine
        script: |
          set -euo pipefail
          flutter test integration_test/ios_customer_flows_test.dart \
            -d "${IOS_TEST_DEVICE:?}" --reporter expanded \
            2>&1 | tee build/ios/simulator-artifacts/customer-flow-tests.log
      - name: Validate simulator results
        script: |
          set -euo pipefail
          python3 -c 'import json; r=json.load(open("build/ios/simulator-artifacts/launch-check.json")); assert r["status"] == "startup_no_detected_fatal_errors", r.get("reason", "Startup failed")'
    artifacts:
      - build/ios/simulator-artifacts/Runner-simulator.zip
      - build/ios/simulator-artifacts/launch.png
      - build/ios/simulator-artifacts/launch-initial.png
      - build/ios/simulator-artifacts/launch-initial-screen-text.json
      - build/ios/simulator-artifacts/launch-check.json
      - build/ios/simulator-artifacts/launch-stdout.log
      - build/ios/simulator-artifacts/launch-stderr.log
      - build/ios/simulator-artifacts/launch-screen-text.json
      - build/ios/simulator-artifacts/customer-flow-tests.log
      - build/ios/simulator-artifacts/native-startup.log
      - build/ios/simulator-artifacts/native-stack.log
